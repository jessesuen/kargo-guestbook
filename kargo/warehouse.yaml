apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: guestbook
  namespace: kargo-guestbook
spec:
  subscriptions:
  - image:
      repoURL: ghcr.io/jessesuen/guestbook
      imageSelectionStrategy: SemVer
      allowTagsRegexes:
      - ^v?[0-9]+\.[0-9]+\.[0-9]+([\+-].*)?$
  - git:
      repoURL: https://github.com/jessesuen/kargo-guestbook.git
      branch: main
      # Only produce new Freight for changes to the manifests that are rendered
      # during promotion (not Kargo/Argo CD config, docs, or scripts).
      includePaths:
      - base
      - env
