apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: promote
  namespace: kargo-guestbook
spec:
  vars:
  - name: gitRepo
    value: https://github.com/jessesuen/kargo-guestbook.git
  - name: imageRepo
    value: ghcr.io/jessesuen/guestbook
  steps:
  # Clone the Git repository that contains the Kustomize configuration
  # to the ./src directory, and the Stage's rendered branch to ./out.
  - uses: git-clone
    config:
      repoURL: ${{ vars.gitRepo }}
      checkout:
      - commit: ${{ commitFrom(vars.gitRepo).ID }}
        path: ./src
      - branch: env/${{ ctx.stage }}
        path: ./out
        # Create the branch if it does not exist.
        create: true
  # Following a "rendered branch" pattern, we delete all files in the
  # ./out directory to ensure that we only have the files that are
  # rendered from the Kustomize configuration in the ./src directory.
  - uses: git-clear
    config:
      path: ./out
  # Update the image in the Stage's Kustomize overlay.
  - uses: kustomize-set-image
    as: update-image
    config:
      path: ./src/env/${{ ctx.stage }}
      images:
      - image: ${{ vars.imageRepo }}
        tag: ${{ imageFrom(vars.imageRepo).Tag }}
  # Render the Stage's Kustomize overlay to the ./out directory.
  - uses: kustomize-build
    config:
      path: ./src/env/${{ ctx.stage }}
      outPath: ./out
  # Commit the rendered manifests.
  - uses: git-commit
    as: commit
    config:
      path: ./out
      message: ${{ task.outputs['update-image'].commitMessage }}
  # Push the changes to the rendered branch.
  - uses: git-push
    config:
      path: ./out
  # Request a sync of the Stage's Argo CD Application to the new commit.
  - uses: argocd-update
    config:
      apps:
      - name: kargo-guestbook-${{ ctx.stage }}
        sources:
        - repoURL: ${{ vars.gitRepo }}
