# These are two analysis templates that query the PokéAPI (https://pokeapi.co)
# and interpret the result.
# The `pokemon` template will always pass.
# The `pokemon-fail` template will make three queries and fail after three attempts.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: pokemon
  namespace: kargo-guestbook
spec:
  metrics:
  - name: pokemon
    interval: 5s
    count: 5
    successCondition: result == true
    failureLimit: 3
    provider:
      web:
        url: https://pokeapi.co/api/v2/pokemon/pikachu
        jsonPath: "{$.is_default}"

---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: pokemon-fail
  namespace: kargo-guestbook
spec:
  metrics:
  - name: pokemon-fail
    interval: 5s
    count: 5
    successCondition: result > 1000
    failureLimit: 3
    provider:
      web:
        url: https://pokeapi.co/api/v2/pokemon/pikachu
        jsonPath: "{$.base_experience}"
