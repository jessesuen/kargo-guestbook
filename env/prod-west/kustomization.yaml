apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

# All environments deploy to the same namespace, so suffix resource names and
# add an env label (including selectors) to keep them from colliding.
nameSuffix: -prod-west
labels:
- pairs:
    env: prod-west
  includeSelectors: true
