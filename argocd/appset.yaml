apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kargo-guestbook
  namespace: argocd
spec:
  generators:
  - git:
      repoURL: https://github.com/jessesuen/kargo-guestbook.git
      revision: HEAD
      directories:
      - path: env/*
  template:
    metadata:
      name: kargo-guestbook-{{path.basename}}
      annotations:
        kargo.akuity.io/authorized-stage: kargo-guestbook:{{path.basename}}
    spec:
      destination:
        namespace: kargo-guestbook
        # Specify either a cluster destination name or server address:
        name: demo
        # server: https://REPLACEME
      project: kargo-guestbook
      source:
        path: ./
        repoURL: https://github.com/jessesuen/kargo-guestbook.git
        targetRevision: env/{{path.basename}}
      syncPolicy:
        syncOptions:
        # All Apps share one namespace, so Argo CD creates it instead of any
        # single App owning the Namespace resource.
        - CreateNamespace=true
