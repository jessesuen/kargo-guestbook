apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    env: dev
  name: guestbook-dev
  namespace: kargo-guestbook
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: guestbook
      env: dev
  template:
    metadata:
      labels:
        app: guestbook
        env: dev
    spec:
      containers:
      - env:
        - name: GREETING
          value: Hello from Kargo
        image: ghcr.io/jessesuen/guestbook:v0.0.88
        name: guestbook
        ports:
        - containerPort: 3000
          name: http
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
