apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    env: dev
  name: guestbook-dev
  namespace: kargo-guestbook
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: guestbook
      env: dev
  template:
    metadata:
      labels:
        app: guestbook
        env: dev
    spec:
      containers:
      - image: ghcr.io/jessesuen/guestbook:v0.0.84
        name: guestbook
        ports:
        - containerPort: 3000
          name: http
