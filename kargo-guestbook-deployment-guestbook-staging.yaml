apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    env: staging
  name: guestbook-staging
  namespace: kargo-guestbook
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: guestbook
      env: staging
  template:
    metadata:
      labels:
        app: guestbook
        env: staging
    spec:
      containers:
      - env:
        - name: GREETING
          value: Hello from Kargo
        image: ghcr.io/jessesuen/guestbook:v0.0.85
        name: guestbook
        ports:
        - containerPort: 3000
          name: http
